baseURL = 'https://simoninhochoi.github.io/distanthead/'
title = 'DistantHead'

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS']

# The page content lives in data/<lang>/*.yaml; content/*.md files are stubs
# that give each page its title, weight (nav order) and layout. Editing the
# YAML changes both languages' pages without touching a template.

[languages]
  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    weight = 1
  [languages.ko]
    languageCode = 'ko-KR'
    languageName = '한국어'
    weight = 2

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[params]
  author = 'Inho Choi'
