about:
  title: About
  kicker: Who is writing
  photo_alt: Inho Choi presenting at a conference
  body:
    - >-
      I study how East Asia's deep history shapes contemporary security dynamics,
      with a focus on US–China relations. My research shows that China's
      strategic behavior draws on a complex repertoire of historical statecraft
      traditions, from moral hegemony to pragmatic accommodation, that continue
      to be selectively reconstructed today. I bring this historical depth to
      bear on the questions that organize East Asian security. What drives
      China's grand strategy? How should middle powers like Korea navigate the
      US–China rivalry? And can competing civilizational worldviews coexist in a
      stable international order?
    - >-
      A second line of work asks the same kind of question of the orders now
      forming rather than of the ones that have passed. The Anthropocene has
      made a planetary order thinkable, and artificial intelligence has made a
      new kind of collective agent actual. Neither fits the concepts that
      international relations built for sovereign states. My recent work tries
      to supply concepts that do fit — a republic of the noosphere for the
      first, and a political theory of clonal collective agency for the second.
    - >-
      Before Kyonggi I taught at Bilkent University, held a USC–Berggruen
      Fellowship at the University of Southern California and the Berggruen
      Institute, and was a senior research fellow at the Institute of
      International Studies, Seoul National University. I wrote my dissertation
      at Johns Hopkins University on the evolution of the virtue of state in
      East Asian international orders.

