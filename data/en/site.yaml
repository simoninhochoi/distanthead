meta_description: >-
  Inho Choi is an assistant professor in the Department of Political Science and
  Diplomacy at Kyonggi University. He works on East Asian international orders,
  the US–China rivalry, middle power strategy, planetary order, and the
  international politics of artificial intelligence.

