title: Teaching
kicker: Courses
lede: >-
  Undergraduate courses: three at Kyonggi University this semester, and three
  earlier at Seoul National University.

sections:
  - heading: Kyonggi University
    entries:
      - heading: International Relations
        kicker: Fall 2026 · Fridays
        gloss: An introduction that starts from the problems students face now.
        body: >-
          An introduction to international politics for students who meet it for
          the first time, starting from urgent problems rather than a catalogue
          of concepts: US–China rivalry and the Korean Peninsula, war and peace,
          climate, and artificial intelligence. The first two hours follow the
          historical and theoretical transformations that Korea, East Asia, and
          the world have passed through since the modern era. The last hour is a
          practicum in using AI as a research tool, to collect, verify, and
          analyze sources. It leads to two reports, one a practical assessment
          of a current issue and one a scholarly forecast.
        tags: [Undergraduate, Introductory]

      - heading: "Globalization and International Relations: Globalization over 13.8 Billion Years"
        kicker: Fall 2026 · Thursdays
        gloss: Globalization read across cosmic, planetary, and human time.
        body: >-
          Reads globalization over 13.8 billion years rather than since
          industrialization, through six overlapping processes: of matter and
          energy, of the living Earth, of mind and technology, of global
          political organization, of sovereign states, and of flows of capital and
          culture. The course descends from the cosmic scale to the human and
          returns in its last week to the question of the first. It joins the
          natural-science narrative of big history and Earth system science to
          the social-science narrative of international politics and political
          economy.
        tags: [Undergraduate, General education]

      - heading: "Regional Politics Seminar: The Unfolding of the East Asian International Order"
        kicker: Fall 2026 · Tuesdays
        gloss: East Asian order from the Ming–Qing empires to AI and the climate crisis.
        body: >-
          Follows the East Asian international order from the Ming and Qing
          empires to the present, not as a survey but through the junctures that
          decide how today's order is read. Before the nineteenth century it
          takes up the Ming, where ritual governance matured into institutions,
          and the Qing, which laid inner Asia over China in a composite order.
          After it, the course runs from the treaty-port encounter of
          <em>tianxia</em> and the international through the Cold War, the rise of
          China, and US–China rivalry to the order that artificial intelligence
          and the climate crisis are reshaping. The first two weeks set out the
          method, and lectures are paired with student presentations and
          discussion.
        tags: [Undergraduate, Advanced]

  - heading: Seoul National University
    entries:
      - heading: "East Asian International Politics: Rethinking US–China Relations"
        kicker: Spring 2026 · Adjunct lecturer
        gloss: US–China relations as a problem of planetary order, in which the rest can steer the superpowers.
        body: >-
          Takes up US–China relations beyond the frame of hegemonic rivalry, as a
          problem of shaping order under planetary crisis. Its premise is that
          middle and neighboring powers can constrain or redirect the superpowers'
          strategic options through norms, institutions, discourse, and
          coalitions, and it asks how the superpowers and the rest might set the
          direction of planetary order together. The course reads world-system
          evolution and republican security theory, the Anthropocene and AI, and
          the strategic traditions of the United States and China, then turns to
          middle-power strategy, the history of the relationship from the Korean
          War through détente to China's rise, and climate and AI. Students write
          two short US–China briefs and a national-strategy paper.
        tags: [Undergraduate, Earlier course]

      - heading: "Korean Diplomatic History: Experience and Evaluation"
        kicker: Fall 2025 · Adjunct lecturer
        gloss: Three dramatic events reconstructed as vividly and accurately as the sources allow.
        body: >-
          Asks students to reconstruct, as accurately and vividly as the sources
          allow, three of the most dramatic events in Korean diplomatic history:
          the Qing invasion of 1636, the Gapsin Coup of 1884, and the July 4
          North–South Joint Communiqué of 1972. The aim is to learn what
          understanding the past demands, and from that indirect experience to
          build the judgment to analyze and assess Korea's international politics
          today. Each student chooses one event and reconstructs it in an essay or
          a work of fiction, or in a team's short film or play.
        tags: [Undergraduate, Earlier course]

      - heading: East Asian International Political Thought
        kicker: Spring 2025 · Adjunct lecturer
        gloss: From the pre-Qin period to the future, and what an IR built on East Asian thought would look like.
        body: >-
          Follows East Asian international political thought from the pre-Qin
          period to the present together with the practice it grew from, centered
          on the Sino-Korean relationship within the Chinese-centered order.
          Because modern IR is itself the product of a time and a place, the first
          two weeks set out the method: reading past thought in its own context
          and, in a sense, living its world indirectly. The course studies the
          five modes by which China governed its periphery, ritual ordering,
          cherishing men from afar, loose rein, peaceful alignment, and military
          punishment, and how neighboring states transformed them. It asks what an
          international politics built on East Asian thought, rather than on
          Europe's modernity, might look like.
        tags: [Undergraduate, Earlier course]
