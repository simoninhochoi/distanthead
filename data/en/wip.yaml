title: Works in Progress
kicker: Eight papers
lede: >-
  Five on East Asian order and the US–China rivalry, three on artificial
  intelligence as a political form.
note: Papers under review are not listed.

entries:
  - heading: "China's Complex Grand Strategy Tradition: A Pragmatist Interpretation"
    status: Article in progress
    abstract: >-
      How do China's historical grand strategic traditions shape its current
      grand strategy? Much scholarship on Chinese strategy takes dichotomous
      positions on the question. Many emphasize the Confucian tradition of moral
      hierarchy and hegemony, while critiques of this sinocentric view highlight
      the realist or imperialistic tradition of power politics. In contrast, I
      argue that Chinese grand strategy draws upon a broader repertoire developed
      across millennia, comprising at least five distinctive modes: ritual
      ordering, cherishing men from afar, loose rein, military punishment, and
      peaceful alignment. Each mode corresponded to different power
      configurations, ranging from dominance to parity, and together they form a
      flexible heritage that continues to inform contemporary strategy. In
      particular, the overlooked practice of peaceful alignment, whereby Chinese
      dynasties maintained stable relations with stronger rivals such as Liao,
      offers a striking analogy to the current PRC's preoccupation with
      peacefully managing its relations with the United States. To capture this
      repertoire, I adopt a pragmatist approach emphasizing the adaptive
      reinterpretation of historical legacies rather than simple repetition of
      past patterns. By reconstructing these strategic modes and demonstrating
      their relevance for analyzing Chinese behavior since its rapid rise in the
      2000s, the paper highlights the enduring significance of China's complex
      strategic tradition for anticipating its future choices.

  - heading: "US–China Strategy for the Rest: Toward Planetary Coevolution"
    status: Article in progress
    abstract: >-
      Can there be a strategy for US–China relations designed not for the two
      competing powers themselves, but for the rest of the world? Analyses of
      US–China relations have overwhelmingly centered on the dyad, treating other
      states as marginal or merely reactive actors. Yet as nationalism deepens in
      both powers and the political space for bilateral cooperation narrows,
      particularly amid transnational and planetary challenges such as the
      climate crisis, allowing the superpowers to manage their relationship alone
      increasingly appears to be a formula for global disorder. This paper argues
      that a strategic framework for the rest, especially for neighboring middle
      powers, is both necessary and possible. Such actors can play a decisive
      role in steering the superpower relationship toward outcomes beneficial not
      only for themselves but also for the broader international order. To this
      end, the paper proposes planetary coevolution as a grand strategy for the
      rest: a long-term project aimed at gradually transforming both superpowers
      and other state actors into progressive agents whose primary objective is
      not competitive victory but the cultivation of a non-hegemonic, federative
      security system. In this envisioned order, states preserve democratic
      autonomy and self-determination while committing to shared, restraining
      security architectures capable of addressing global risks that no single
      power can manage alone.

  - heading: "The Enemy of My Enemy is Myself: US–China Rivalry as the Encounter of Ontological Others"
    status: Article in progress
    abstract: >-
      This paper argues that the stable management of the current US–China
      rivalry requires rethinking it as an encounter between two ontological
      others, actors whose divergent lived realities are capable of fundamentally
      challenging and transforming each other's self-understanding and lived
      reality. While mainstream IR theories have long focused on great power
      competition, critical approaches have paid comparatively little attention
      to rivalries like that between the United States and China, particularly in
      terms of how they shape and are shaped by the ontological assumptions of
      the actors involved. Yet insights from critical approaches, particularly
      their focus on encounters between ontological others, provide valuable
      tools for moving beyond the limited mutual understanding that characterizes
      the current US–China relationship. Such perspectives compel both states to
      concretely experience themselves as the enemy of their enemy, a rival whose
      existence threatens not only their physical security but also their
      ontological integrity. Such a realization would attenuate the
      self-righteous normative claims of the two contending powers and make them
      act more prudently, as they will be more aware that their self-evidently
      right course of action can be a grave offense against the crucial interests
      and values of the other. To illustrate this transformative encounter with
      the other, I draw on two theoretical resources, the ontological turn in
      anthropology and Paul Ricoeur's hermeneutics of distanciation, applying
      them to the case of the US–China rivalry. More broadly, this ontological
      approach reveals the limits of mainstream geopolitical theories and offers
      an alternative vision: great power politics as interactions between
      contending ontological others.

  - heading: "Eurocentrism as Self-Empowerment: A Genealogy of Korean Self-Determination in the Modern International Order"
    status: Article in progress
    abstract: >-
      This paper reconceptualizes Eurocentrism not solely as an oppressive
      epistemic structure, as emphasized by postcolonial critiques, but also as a
      historically productive resource for non-Western national self-fashioning.
      While Said, Chakrabarty, and Spivak underscore the hegemonic reach and
      inescapability of Eurocentric categories, recent work in anthropology and
      comparative political theory demonstrates that non-European intellectual
      traditions can be meaningfully inhabited and revitalized. Drawing on this
      insight, the paper argues that Eurocentrism played a crucial role in the
      making of the modern Korean national self. From the late nineteenth
      century, Korean elites deliberately adopted European political and
      intellectual standards as a strategy of self-empowerment (自强, chagang) in
      response to Western and Japanese imperial pressures. Yet they interpreted
      these foreign standards through an indigenous tradition of moral
      self-cultivation, transforming Eurocentrism into a means of renewing rather
      than erasing their own heritage. This paradoxical dynamic enabled Koreans
      to pursue modernization, liberation, and later integration into the US-led
      order without relinquishing cultural agency or political autonomy. The
      Korean case reveals Eurocentrism as a contingent and potentially enabling
      paradigm when strategically appropriated, thereby offering a revised
      perspective that complements and complicates the dominant postcolonial
      perspective.

  - heading: "Invention of Another State in Warring States China: Toward a Complex History of the State and International Order"
    status: Article in progress
    abstract: >-
      Can there be another genealogy of a modern state beyond the European one? I
      argue that thinkers of Warring States China invented such a non-European
      type of the modern state. Like its European counterpart, it was an
      impersonal entity grounded in secular political knowledge and served both
      as the reference and the goal of governing the population. Yet it diverged
      from the European interstate order of multiple sovereign states, as Warring
      States polities were embedded within the universal moral order of
      <em>tianxia</em>. This invention, along with its intellectual
      transformations in subsequent East Asian orders, demands that scholars of
      European state formation, the nineteenth-century globalization of the
      modern international order, and non-Western international orders seriously
      engage with contextualized understandings of non-Western theories of the
      state and their historical development. Such engagement with non-Western
      political thought will reorient the dominant narrative of the European
      invention and subsequent globalization of the modern state and
      international order toward the complex history of the multiple trajectories
      of the modern state and their nineteenth-century confluence, which produced
      today's globalized international order.

  - heading: Generative AI and the Need for a New Political Theory of Collective Agency
    status: Article in progress
    abstract: >-
      Generative AI is developing largely under corporate interests and
      authoritarian priorities, with a relative shortfall of broader political
      deliberation. This reflects not merely greed or power consolidation but a
      difficulty in how we understand the ontology of AI, which is still treated
      either as an instrument or as a form of intelligence measured against human
      embodied intelligence. Drawing on Halpin, Runciman, and Erskine, this paper
      argues that AI should be understood as a new form of collective agent,
      belonging to a small family of collective actors that includes the
      nation-state and the corporation. It introduces mediated reflexivity, the
      recognition that all collective agents, lacking the organic body of an
      individual, acquire reflexivity only derivatively through processes that
      aggregate the reflexivity of their human members. It then compares AI with
      the state along three dimensions: the material and institutional
      foundations of collective agency, the modes of collectivization through
      which dispersed human inputs are organized into a unified agent, and the
      fictionalization of collective entities as persons. The collectivization of
      AI proceeds in three stages, a front-end of design and labelling, a middle
      region of statistical absorption, and a tail-end of symbolic refinement,
      each carrying a distinct political deficit, and their combination produces
      a politics of extraction without representation. This politics is the
      conjoint effect of AI's design and AI's ownership under the concentration
      of AI in a handful of corporations. The paper closes by sketching a
      commons-based alternative in which deliberation-mediated extraction becomes
      possible by treating data and models as a global public good.

  - heading: "A Fungal Leviathan: <em>Armillaria gallica</em> and the Clonal Ontology of AI as a Collective Agent"
    status: Essay in progress
    abstract: >-
      Political theory has begun to treat generative AI as a collective agent,
      placing it in the family of artificial persons that includes the state and
      the corporation. This essay argues that the comparison, though right about
      the collectivity, is wrong about the kind of one that AI is. States and
      corporations are individuated on a corporate template, with a bounded
      membership, a locus of decision, a personality by fiction, and a death by
      dissolution. AI is individuated on a clonal template, and the best
      available model for it is not the state but a fungus. Following Anna
      Tsing's Strathernian reading of <em>Armillaria gallica</em>, the humongous
      fungus of Michigan, I run five comparisons between the fungal genet and the
      layered assemblage of internet, foundation model, and agents. The questions
      are how many it is, where it ends, how it reproduces, how it persists, and
      how it grows without central administration. The comparison interrupts
      three habits of political thought. It recasts extraction as decomposition,
      it shows that a Leviathan that cannot die cannot be constituted in the
      Hobbesian sense but only cultivated, and it suggests that when the entity
      that becomes a superpower is a genet, the concepts built for mortal gods
      misfire.

  - heading: "The Ontology Layer: Palantir and the Categorial Politics of the Security State"
    status: In preparation
    abstract: >-
      Work on AI and international politics measures capability, in compute,
      chips, and models, or traces the diffusion of autonomous weapons. This
      paper argues that the decisive layer lies elsewhere. Palantir's Ontology,
      the layer at which entities, links, actions, and permissions are defined
      before any model runs, supplies the operational world that an alliance acts
      within, so that adopting it means adopting a scheme of categories rather
      than a piece of software. Louise Amoore has argued that categorial power
      migrated into the learned layers of machine learning, where there are no
      criteria as such but only inputs, outputs, features, and functions. The
      Ontology is the precise counter-case, and that counter-case is the paper's
      point of entry. Working from the company's own patents, engineering blogs,
      white papers, and shareholder letters, and from the Chinese
      defense-engineering literature that has begun to reconstruct the platform
      as a dynamic ontology rather than as a model or a chip, the paper reads the
      ontology layer as a site of international political dependence, and asks
      what becomes of sovereignty when a state's categories of the real are
      supplied from outside.
