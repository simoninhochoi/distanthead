title: 연구
kicker: 다섯 영역
lede: >-
  셋은 미중 경쟁을 동아시아 경세의 오래된 역사를 통해 읽고, 둘은 국제질서의
  단위가 더 이상 국가만이 아닐 때 그 질서가 무엇이 되는지를 묻는다.
strands_label: 진행 중인 갈래

areas:
  - id: grand-strategy
    label: 영역 01
    heading: 중국의 복합 대전략
    gloss: 수천 년에 걸쳐 축적된 다섯 가지 경세 양식, 그리고 오늘의 선별적 재구성.
    body:
      - >-
        중국의 역사적 대전략 전통은 오늘의 행위를 어떻게 규정하는가. 지배적인
        설명들은 중국의 전략을 하나의 전통으로 환원한다. 유교적 도덕 위계이거나,
        아니면 현실주의적 권력정치다. 이 연구는 그보다는 중국의 대전략이 수천
        년에 걸쳐 형성된 더 넓은 목록에 기대어 있다고 논변한다. 그 목록에는
        적어도 다섯 가지의 구별되는 양식이 있다. 예(禮)에 의한 질서화,
        회유원인(懷柔遠人), 기미(羈縻), 정벌(征伐), 그리고 화친(和親)이다. 각각의
        양식은 서로 다른 권력 배치에 대응했고, 이들이 함께 오늘의 전략에까지
        이어지는 유연한 유산을 이룬다.
      - >-
        그동안 주목받지 못한 화친의 실천, 즉 중국의 왕조들이 자신보다 강한
        상대와 안정된 관계를 유지해 온 방식은 오늘의 중화인민공화국이 미국과의
        관계를 관리하는 방식을 분석하는 데 인상적인 렌즈를 제공한다. 이 연구는
        역사적 유산의 단순한 반복이 아니라 적응적 재해석을 강조하는 실용주의적
        접근을 택해, 중국의 복합적인 전략 목록이 미중 경쟁의 시대에 어떻게
        선별적으로 재구성되고 있는지를 추적한다.
    strands:
      - "「중국의 복합 대전략 전통: 실용주의적 해석」, 집필 중"
      - 화친이라는 반복되는 양식, 송·요(宋遼)의 화의에서 오늘까지
      - 청대 정서(政書), 명·청 실록, 조선의 외교문서를 자료로

  - id: ontological-encounter
    label: 영역 02
    heading: 존재론적 타자의 만남으로서의 미중 경쟁
    gloss: 존재론적 타자로서의 두 강대국, 그리고 상호이해가 실제로 치러야 할 대가.
    body:
      - >-
        미중 경쟁은 통상 물질적 권력과 제도적 영향력을 둘러싼 각축으로
        이해된다. 이 연구는 그보다 더 아래로 내려가, 이 경쟁이 두 존재론적 타자의
        만남이기도 하다고 논변한다. 즉 서로 다른 삶의 실재를 사는 행위자들이
        상대의 자기이해를 근본에서 흔들 수 있는 관계인 것이다. 인류학의
        존재론적 전회와 리쾨르(Paul Ricoeur)의 거리두기(distanciation)
        해석학에 기대어, 미국과 중국 사이의 유의미한 상호이해가 각자로 하여금
        적이 자신을 보는 방식 그대로 자신을 구체적으로 체험할 것을 요구한다는
        점을 보인다. 그 적이란 상대의 안보만이 아니라 존재론적 온전함까지
        위협하는 상대다.
      - >-
        이러한 자각은 경합하는 두 강대국의 독선적인 규범적 주장을 누그러뜨리고
        보다 신중한 처신을 이끌어낼 수 있다. 관련된 작업에서는 중국성이라는 의미
        자체가 고정된 민족적 본질이 아니라 문화횡단적이고 경합적인 구성물이었음을
        규명한다. 이는 오늘의 국제정치에서 중국의 문명적 주장을 어떻게 읽을
        것인가의 문제와 곧바로 이어진다.
    strands:
      - "「내 적의 적은 나 자신이다: 존재론적 타자의 만남으로서의 미중 경쟁」, 집필 중"
      - "&ldquo;On Being Chinese and Being Complexified&rdquo;, <em>Review of International Studies</em> 49-3 (2023)"
      - 「객관, 주체, 그리고 타자의 국제정치학」, 『국제정치논총』 64-4 (2024)

  - id: middle-power
    label: 영역 03
    heading: 미중 경쟁 시대의 중견국 전략
    gloss: 나머지를 위한 대전략으로서의 행성적 공진화, 그리고 다시 읽는 사대.
    body:
      - >-
        미중 경쟁이 격화되고 양자 협력의 정치적 공간이 좁아지면서, 두
        초강대국이 자기들끼리 관계를 관리하도록 내버려 두는 것은 점점 더 세계적
        무질서의 공식처럼 보이게 되었다. 이 연구는 나머지를 위한, 특히 한국과
        같은 인접 중견국을 위한 전략적 틀이 필요하기도 하고 가능하기도 하다고
        논변한다. 여기서 제안하는 것은 중견국의 대전략으로서의 행성적
        공진화(planetary coevolution)다. 두 초강대국을 비패권적이고 연방적인
        안보 구조로 서서히 이끌어, 국가들이 민주적 자율성을 보존하면서도 서로를
        제약하는 기제에 함께 묶이도록 하는 장기적 기획이다.
      - >-
        이 연구는 또한 한국 경세(經世)의 역사적 실천, 그중에서도 사대(事大)의
        전통에 대한 연구에 기댄다. 사대는 수동적 복종이 아니라 지배적 강대국과
        전략적으로 관여하는 정교한 목록이며, 이렇게 다시 읽을 때 오늘의 중견국
        외교를 위한 역사적 자원이 회복된다.
    strands:
      - "「나머지를 위한 미중 전략: 행성적 공진화를 향하여」, 집필 중"
      - 「사대의 국제정치이론」, 『국제정치논총』 63-1 (2023)
      - 질서공유와 집합적 패권, 패권전이의 대안으로 (오인환 공저)

  - id: planetary-order
    label: 영역 04
    heading: 강대국 경쟁 너머의 행성질서
    gloss: 마음권과 성리학적 질서론, 행성적 공화국의 자원으로.
    body:
      - >-
        강대국 경쟁은 국제질서가 마주한 유일한 도전도, 어쩌면 가장 중대한 도전도
        아니다. 인류세(人類世, Anthropocene), 즉 인류가 지질학적 힘이 된 시대는
        주권적 경쟁의 논리를 넘어서는 행성질서를 요구한다. 이 연구는 그러한
        질서가 어떤 모습일 수 있는지를 어울릴 법하지 않은 두 대화 상대를 함께
        불러 검토한다. 떼이야르 드 샤르댕(Pierre Teilhard de Chardin)의
        마음권(noosphere) 이론과 성리학의 정치철학이다.
      - >-
        여기서 제안하는 마음권의 공화국은 개별 행위자들이 자율성을 보존한 채
        자신의 윤리적 정치적 지평을 행성 규모로 확장하는 행성적 거버넌스의
        상이다. 위로부터의 통합이 아니라 아래로부터의 공화적 질서인 것이다. 보다
        넓게 보면 이 연구는 어느 한 문명의 사유만으로는 풀 수 없는 도전에 대해
        동아시아의 지적 전통이 살아 있는 자원으로 쓰일 수 있음을 보인다.
    strands:
      - "「인류세와 행성질서: 마음권의 공화국」, 『한국정치학회보』 58-4 (2024)"
      - 떼이야르의 마음권을 성리학적 질서론으로 다시 읽기
      - 인류세의 정치적 허구 다시 짓기, 리바이어던에서 팔조목(八條目)으로

  - id: ai
    label: 영역 05
    heading: 인공지능의 국제정치
    gloss: 새로운 종류의 집합적 행위체로서의 인공지능, 그리고 온톨로지 층위의 정치.
    body:
      - >-
        인공지능은 대개 능력으로서 국제정치에 들어온다. 연산과 칩과 모델, 그리고
        그것들을 호령하는 국가들의 문제로 말이다. 이 연구는 인공지능을 하나의
        정치적 형식으로도 다룬다. 거대 모델은 도구도 아니고 개별적인 지성도
        아니며, 새로운 종류의 집합적 행위체다. 국가나 기업과 마찬가지로 흩어진
        인간의 기여를 흡수하여 통합된 행위자로 출현하지만, 대표가 아니라 추출을
        통해 구성되며, 자신을 이루는 노동을 제공한 이들은 그 성원됨에 동의한 적이
        없다.
      - >-
        그러나 국가와의 비교는 집합성에 대해서는 옳고 그 집합성의 종류에
        대해서는 틀렸다. 국가와 기업은 회사적 주형 위에서 개체화된다. 경계 지어진
        성원, 결정의 자리, 허구에 의한 인격, 해산에 의한 죽음이 그것이다.
        인공지능은 클론적 주형 위에서 개체화된다. 바로 이 때문에 인공지능의
        모형으로는 리바이어던보다 균류가 낫고, 초강대국이 되는 존재가 죽을 수
        없을 때 죽을 수 있는 신을 위해 벼려진 개념들은 빗나가게 된다.
      - >-
        여기서 세 갈래의 작업이 갈라져 나온다. 첫째는 범주적 권력의 자리를
        모델에서 온톨로지 층위로 옮기는 일이다. 동맹과 적대가 그 안에서 행위하는
        작전적 세계가 정의되는 곳이 바로 이 층위이며, 인공지능과 국제정치에 관한
        문헌은 이곳을 거의 들여다보지 않았다. 둘째는 마음권, 즉 인공지능이 지금
        재조직하고 있는 지식과 성찰의 행성적 층이 소수의 기업과 정부에 의해
        인클로저되지 않고 인간과 기계가 함께 지키는 커먼스로 유지될 수 있는가를
        묻는다. 그리고 그것이 가능하다면 민주주의와 자본주의는 무엇이 되는가를
        묻는다. 셋째는 연산과 데이터 노동과 인클로저의 정치경제를, 기술낙관론이라면
        풍요의 언어로 진행하고 싶어 할 논쟁으로 되돌려 놓는다.
    strands:
      - 「생성형 AI와 새로운 집합적 행위체의 정치이론의 필요성」, 집필 중
      - "「균류 리바이어던: <em>Armillaria gallica</em>와 집합적 행위체로서 인공지능의 클론적 존재론」, 집필 중"
      - "온톨로지 층위: 팔란티어와 안보국가의 범주 정치, 준비 중"
      - "행성적 커먼스로서의 마음권: 인간과 인공지능의 공진화, 그리고 민주주의와 자본주의의 향방"
      - "인공지능의 국제정치경제: 연산, 데이터 노동, 인클로저, 그리고 풍요의 언어에 맞서"
      - 미중 인공지능 경쟁과 한반도 질서의 장기 전망, 공저 단행본 기획에 참여
