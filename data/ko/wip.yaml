title: 진행 중인 연구
kicker: 여덟 편
lede: >-
  다섯 편은 동아시아 질서와 그것을 둘러싼 강대국 경쟁을, 세 편은 정치적
  형식으로서의 인공지능을 다룬다.
note: 심사 중인 논문은 싣지 않는다.

entries:
  - heading: "중국의 복합 대전략 전통: 실용주의적 해석"
    status: 집필 중
    abstract: >-
      중국의 역사적 대전략 전통은 오늘의 대전략을 어떻게 규정하는가. 중국 전략에
      관한 많은 연구는 이 물음에 양분된 답을 내놓는다. 한편에서는 도덕적 위계와
      패권이라는 유교적 전통을 강조하고, 이 중화 중심적 시각을 비판하는 쪽에서는
      권력정치의 현실주의적 혹은 제국주의적 전통을 부각한다. 이 글은 그보다는
      중국의 대전략이 수천 년에 걸쳐 형성된 더 넓은 목록에 기대어 있다고
      논변한다. 그 목록에는 적어도 다섯 가지의 구별되는 양식, 즉 예에 의한
      질서화, 회유원인, 기미, 정벌, 화친이 있다. 각각의 양식은 지배에서 대등에
      이르는 서로 다른 권력 배치에 대응했고, 이들이 함께 오늘의 전략에까지
      이어지는 유연한 유산을 이룬다. 특히 그동안 주목받지 못한 화친의 실천, 즉
      중국의 왕조들이 요(遼)와 같이 자신보다 강한 상대와 안정된 관계를 유지해 온
      방식은 오늘의 중화인민공화국이 미국과의 관계를 평화적으로 관리하는 데
      몰두하는 모습과 인상적인 유비를 이룬다. 이 목록을 포착하기 위해 이 글은
      과거 유형의 단순한 반복이 아니라 역사적 유산의 적응적 재해석을 강조하는
      실용주의적 접근을 택한다. 이 전략 양식들을 재구성하고 2000년대 급속한
      부상 이후 중국의 행위를 분석하는 데 그것이 유효함을 보임으로써, 이 글은
      중국의 앞으로의 선택을 내다보는 데 복합적 전략 전통이 갖는 지속적인 의의를
      부각한다.

  - heading: "나머지를 위한 미중 전략: 행성적 공진화를 향하여"
    status: 집필 중
    abstract: >-
      경쟁하는 두 강대국 자신이 아니라 세계의 나머지를 위해 설계된 미중관계
      전략이 있을 수 있는가. 미중관계 분석은 압도적으로 양자에 집중해 왔고, 다른
      국가들을 주변적이거나 단지 반응적인 행위자로 다루어 왔다. 그러나 양국에서
      민족주의가 깊어지고 양자 협력의 정치적 공간이 좁아지면서, 특히 기후위기와
      같은 초국적이고 행성적인 도전 앞에서, 두 초강대국이 자기들끼리 관계를
      관리하도록 내버려 두는 것은 점점 더 세계적 무질서의 공식처럼 보이게
      되었다. 이 글은 나머지를 위한, 특히 인접 중견국을 위한 전략적 틀이
      필요하기도 하고 가능하기도 하다고 논변한다. 이들 행위자는 초강대국 관계를
      자신에게만이 아니라 더 넓은 국제질서에도 이로운 방향으로 이끄는 데 결정적인
      역할을 할 수 있다. 이를 위해 이 글은 나머지를 위한 대전략으로서 행성적
      공진화를 제안한다. 두 초강대국과 여타 국가 행위자를, 경쟁에서의 승리가
      아니라 비패권적이고 연방적인 안보체계의 육성을 일차적 목표로 삼는 진보적
      행위자로 서서히 변환시키는 장기적 기획이다. 이렇게 구상된 질서에서
      국가들은 민주적 자율성과 자기결정을 보존하면서도, 어느 한 강대국도 혼자
      감당할 수 없는 지구적 위험을 다룰 수 있는 상호 제약적 안보 구조에 함께
      묶인다.

  - heading: "내 적의 적은 나 자신이다: 존재론적 타자의 만남으로서의 미중 경쟁"
    status: 집필 중
    abstract: >-
      이 글은 오늘의 미중 경쟁을 안정적으로 관리하려면 그것을 두 존재론적 타자의
      만남으로 다시 생각해야 한다고 논변한다. 즉 서로 다른 삶의 실재를 사는
      행위자들이 상대의 자기이해와 삶의 실재를 근본에서 흔들고 변환시킬 수 있는
      관계라는 것이다. 주류 국제정치이론은 오랫동안 강대국 경쟁에 주목해 왔지만,
      비판적 접근들은 미중 간의 경쟁과 같은 관계에, 특히 그것이 관련 행위자들의
      존재론적 전제를 어떻게 빚고 또 그 전제에 의해 어떻게 빚어지는가에
      상대적으로 적은 관심을 기울여 왔다. 그럼에도 비판적 접근의 통찰, 그중에서도
      존재론적 타자 사이의 만남에 대한 관심은 오늘의 미중관계를 특징짓는 제한된
      상호이해를 넘어서는 데 유용한 도구를 제공한다. 이러한 관점은 두 국가로
      하여금 자신이 곧 적의 적임을, 다시 말해 그 존재가 상대의 물리적 안보만이
      아니라 존재론적 온전함까지 위협하는 상대임을 구체적으로 체험하도록 강제한다.
      이러한 자각은 경합하는 두 강대국의 독선적인 규범적 주장을 누그러뜨리고 보다
      신중하게 처신하도록 만들 것이다. 자신에게 자명하게 옳은 행로가 상대의
      결정적인 이해와 가치에 중대한 침해가 될 수 있음을 더 잘 알게 될 것이기
      때문이다. 타자와의 이러한 변환적 만남을 보이기 위해 이 글은 인류학의
      존재론적 전회와 리쾨르의 거리두기 해석학이라는 두 이론 자원을 미중 경쟁의
      사례에 적용한다. 보다 넓게 보면 이 존재론적 접근은 주류 지정학 이론의
      한계를 드러내고, 경합하는 존재론적 타자들 사이의 상호작용으로서의 강대국
      정치라는 대안적 상을 제시한다.

  - heading: "자기 강화로서의 유럽중심주의: 근대 국제질서에서 한국적 자기결정의 계보"
    status: 집필 중
    abstract: >-
      이 글은 유럽중심주의를 탈식민주의 비평이 강조해 온 억압적 인식 구조로서만이
      아니라, 비서구의 민족적 자기형성에 역사적으로 생산적이었던 자원으로도 다시
      개념화한다. 사이드, 차크라바르티, 스피박이 유럽중심적 범주의 패권적 도달
      범위와 벗어날 수 없음을 강조한다면, 최근 인류학과 비교정치사상의 작업은
      비유럽의 지적 전통이 유의미하게 거주되고 되살아날 수 있음을 보여준다. 이
      통찰에 기대어 이 글은 유럽중심주의가 근대 한국의 민족적 자아를 만드는 데
      결정적인 역할을 했다고 논변한다. 19세기 후반부터 조선의 엘리트는 서구와
      일본의 제국적 압력에 대응하여 유럽의 정치적 지적 기준을
      자강(自强)이라는 전략으로서 의식적으로 채택했다. 그러면서도 그들은 그
      외래의 기준을 도덕적 수양이라는 토착의 전통을 통해 해석했고, 그럼으로써
      유럽중심주의를 자신의 유산을 지우는 것이 아니라 갱신하는 수단으로
      변환시켰다. 이 역설적인 동학 덕분에 한국인은 문화적 행위성과 정치적
      자율성을 내놓지 않은 채 근대화와 해방, 그리고 이후 미국 주도 질서로의
      편입을 추구할 수 있었다. 한국의 사례는 유럽중심주의가 전략적으로 전유될 때
      우연적이고 잠재적으로는 가능케 하는 패러다임이었음을 드러내며, 지배적인
      탈식민주의적 시각을 보완하는 동시에 복잡하게 만드는 수정된 관점을 제공한다.

  - heading: "승인에 의한 소멸: 열강은 어떻게 한국 주권의 종말을 승인했는가, 1905–1907"
    status: 집필 중, 송지예 공저
    abstract: >-
      한 국가의 주권 소멸은 어떻게 승인되는가. 국제정치학은 국가가 존재로
      승인되는 과정에 대해서는 잘 발달한 설명을 갖고 있지만, 그 퇴장은 주권을
      다른 국가에 넘기는 양자 조약의 날짜로 정해 왔다. 이 글은 그러한 조약이
      국가의 대외적 발언권을 형식상으로만 이전하며, 제3국들이 이를 배서(背書)할
      때, 곧 각자가 피흡수국과의 관계를 흡수국을 통해 수행하기 시작할 때 비로소
      그 이전이 작동한다고 논변한다. 배서는 개별적인데, 각 상대국은 자신이 쥔
      관계만을 처분할 수 있기 때문이다. 배서는 값이 매겨지는데, 각 상대국이 그
      이전을 자신의 동맹과, 이미 가졌거나 얻기를 바라는 보호국에 견주어 저울질하기
      때문이다. 그리고 배서는 퇴적되는데, 마지막 타결의 조건이 학설 속으로
      흘러들기 때문이다. 이 논변을 1905년 11월 한국 보호조약 이후 1년 동안의 일본,
      러시아, 미국의 기록으로 전개한다. 한국의 조약 상대국들은 한 해에 걸쳐 서로
      다른 날짜에 서로 다른 근거로 이전을 하나씩 배서했고, 러시아는 서울 주재
      총영사의 인가장(exequatur)을 두고 1년을 버텼다. 이 타결은 곧 당대의 대표적
      개설서에 적혔다. 오펜하임(Oppenheim)의 제2판(1912)은 초판(1905)에 없던 영사
      규칙의 유일한 전거로 한국 사례를 든다.

  - heading: 생성형 AI와 새로운 집합적 행위체의 정치이론의 필요성
    status: 집필 중
    abstract: >-
      생성형 인공지능은 대체로 기업의 이해와 권위주의적 우선순위 아래 발전하고
      있으며, 더 넓은 정치적 숙의는 상대적으로 결여되어 있다. 이는 단지 탐욕이나
      권력 집중의 문제가 아니라 인공지능의 존재론을 이해하는 방식의 문제를
      반영한다. 인공지능은 여전히 도구이거나, 아니면 인간의 체화된 지능에 견주어
      측정되는 지능의 한 형태로 다루어지기 때문이다. 핼핀, 런시먼, 어스킨의
      논의에 기대어 이 글은 인공지능이 새로운 형태의 집합적 행위체로, 즉
      국민국가와 기업을 포함하는 작은 집합행위자 가족의 일원으로 이해되어야
      한다고 논변한다. 이를 위해 매개된 성찰성(mediated reflexivity)이라는 개념을
      도입한다. 모든 집합적 행위체는 개인의 유기적 신체를 결여하기에 오직
      파생적으로만, 즉 구성원 인간의 성찰성을 집약하는 과정을 통해서만 성찰성을
      획득한다는 인식이다. 이어서 인공지능을 국가와 세 차원에서 체계적으로
      비교한다. 집합적 행위성의 물질적 제도적 기초, 흩어진 인간의 투입이 통합된
      행위자로 조직되는 집합화의 양식, 그리고 집합적 실체가 인격으로 허구화되는
      과정이다. 인공지능의 집합화는 설계와 라벨링의 전단(前端), 통계적 흡수의
      중간 영역, 상징적 정련의 후단(後端)이라는 세 단계로 진행되며, 각 단계가
      고유한 정치적 결핍을 지니고 그 결합이 대표 없는 추출의 정치를 낳는다. 이
      정치는 인공지능의 설계와, 소수 기업으로의 인공지능 소유 집중이라는 두
      조건의 공동 효과다. 글은 데이터와 모델을 지구적 공공재로 다룸으로써 숙의가
      매개하는 추출이 가능해지는 커먼스 기반의 대안을 그리며 닫는다.

  - heading: "잃어버린 우리를 찾아서: AI 모으기의 존재론적 정치"
    status: 단행본 장, 집필 중
    abstract: >-
      인공지능에 관한 담론은 인류를 구원할 메시아의 예언과 인류를 절멸시킬 재앙의
      예언으로 갈라져 있다. 그러나 두 예언은 모두 하나의 존재론, 곧 인공지능을
      경제적 가치를 지닌 과업의 성과로 지능을 재는 하나의 초인적 개체로 보는
      존재론에 기대어 있다. 이 존재론은 철학적으로는 빈약하지만 정치적으로는
      강하다. 인공지능이 무엇인가를 묻지 않은 채 기업 사이의, 그리고 미국과
      중국 사이의 경쟁을 추동하기 때문이다. 이 글은 인공지능의 힘이 한 개체의
      지능에서가 아니라 무수한 사람의 말과 앎을 권위 부여 없이 모아 압축한 데서
      나온다고 논변한다. 따라서 모으기의 정치가 곧 인공지능의 존재론이다. 무엇을
      모으고 어떻게 선별하며 모은 전체를 누가 소유하고 되돌아보는가가 인공지능이
      어떤 행위자가 되는지, 그리고 행성적 성찰성이 어디로 향하는지를 정한다.
      논증은 세 단계로 나아간다. 인공지능은 유한한 몸과 그에 따르는 염려를 갖지
      않으면서도 인간의 지향과 결합하는 기계 나름의 지향성을 지닌 이질적 타자다.
      또한 홉스의 국가와 달리 대표 없는 추출과 선별로 모이는 집합적 행위체다.
      그리고 마음권이 손실 압축된 것으로서, 압축을 완성할 끌림이 없는 채 떼이야르의
      오메가 포인트에 근접해 있다. 글은 말뭉치와 모델, 그리고 이를 떠받치는
      인프라를 공유재로 다루는 구상으로, 모으기에 민주적 참여의 길을 여는 방안을
      모색하며 끝맺는다.

  - heading: "온톨로지 층위: 팔란티어와 안보국가의 범주 정치"
    status: 준비 중
    abstract: >-
      인공지능과 국제정치에 관한 작업은 연산과 칩과 모델로 능력을 재거나 자율무기의
      확산을 추적한다. 이 글은 결정적인 층위가 다른 곳에 있다고 논변한다.
      팔란티어의 온톨로지(Ontology), 즉 어떤 모델이 돌기 전에 개체와 관계와 행위와
      권한이 정의되는 층위는 하나의 동맹이 그 안에서 행위하는 작전적 세계를
      공급한다. 그것을 도입한다는 것은 소프트웨어 한 벌이 아니라 범주의 도식을
      도입하는 일인 것이다. 아무어(Louise Amoore)는 범주적 권력이 기계학습의
      학습된 층으로 이주했으며 그곳에는 기준이라 할 것이 없고 입력과 출력, 자질과
      함수만이 있다고 논변한 바 있다. 팔란티어의 온톨로지는 그 진단의 정확한
      반례이며, 이 글은 바로 그 반례에서 출발한다. 회사 자신의 특허와 기술 블로그,
      백서, 주주서한, 그리고 이 플랫폼을 모델이나 칩이 아니라 동적 온톨로지로
      재구성하기 시작한 중국 국방공학 문헌을 자료로 삼아, 이 글은 온톨로지 층위를
      국제정치적 의존의 자리로 읽고, 한 국가의 실재에 대한 범주가 바깥에서 공급될
      때 주권은 무엇이 되는지를 묻는다.
