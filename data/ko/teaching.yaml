title: 강의
kicker: 강좌
lede: >-
  이번 학기 경기대학교의 학부 강의 셋, 그리고 서울대학교에서 맡았던 강의.

sections:
  - heading: 경기대학교
    entries:
      - heading: 국제관계론
        kicker: 2026학년도 2학기 · 금요일
        gloss: 학생들이 지금 마주한 문제에서 출발하는 입문.
        body: >-
          국제정치학을 처음 접하는 학생을 위한 입문 강의로, 개념을 나열하는 대신
          긴박한 문제에서 출발한다. 미중 전략경쟁과 한반도의 진로, 전쟁과 평화,
          기후위기와 인공지능이 그것이다. 수업의 앞 두 교시는 근대 이래 한국과
          동아시아, 세계가 거쳐 온 역사적이고 이론적인 변환을 따라가는 입문
          강의이고, 마지막 교시는 인공지능을 연구 도구로 운용해 자료를 수집하고
          검증하고 분석하는 실습이다. 실습은 두 편의 보고서로 이어진다. 한 편은
          당면한 국제 현안을 다루는 실무형 정세분석이고, 다른 한 편은 학술형
          전망분석이다.
        tags: [학부, 입문]

      - heading: "세계화와 국제관계: 138억 년의 세계화"
        kicker: 2026학년도 2학기 · 목요일
        gloss: 우주와 행성, 인간의 시간에 걸쳐 읽는 세계화.
        body: >-
          세계화를 산업화 이후가 아니라 138억 년의 시간 위에서 읽는다. 물질과
          에너지, 생명계, 마음과 기술, 지구적 정치 조직, 주권국가, 자본과 문화의
          흐름이라는 서로 맞물린 여섯 과정이 그 틀이다. 강의는 우주의 척도에서
          출발해 인간의 척도로 내려온 뒤, 마지막 주에 첫 주의 물음으로 되돌아간다.
          거대사와 지구시스템과학이라는 자연과학의 서사를 국제정치와 정치경제라는
          사회과학의 서사에 잇는다.
        tags: [학부, 교양]

      - heading: "지역정치특강: 동아시아 국제질서의 전개"
        kicker: 2026학년도 2학기 · 화요일
        gloss: 명·청 제국에서 인공지능과 기후위기에 이르는 동아시아 질서.
        body: >-
          명·청 제국의 질서에서 오늘에 이르기까지 동아시아 국제질서의 전개를
          통사가 아니라 결정적인 국면을 골라 따라간다. 19세기 이전에는 예치(禮治)가
          제도로 성숙한 명과 내륙아시아와 중화를 겹쳐 놓은 청의 복합질서를 다루고,
          그 뒤로는 천하와 국제가 충돌한 개항기에서 냉전, 중국의 부상, 미중
          전략경쟁을 거쳐 인공지능과 기후위기가 재편하는 현재까지 간다. 앞 두
          주에는 방법론을 먼저 놓고, 강의는 수강생 발표와 토론과 함께 진행한다.
        tags: [학부, 전공심화]

  - heading: 서울대학교
    entries:
      - heading: "한국외교사: 체험과 평가"
        kicker: 2025학년도 2학기 · 강사
        gloss: 가장 극적인 세 사건을 사료가 허락하는 만큼 정확하고 생생하게 복원한다.
        body: >-
          한국외교사의 사건들 가운데 가장 극적이라 할 세 사건, 곧 병자호란(1636),
          갑신정변(1884), 7·4남북공동성명(1972)의 순간들을 학생들이 사료가 허락하는
          만큼 정확하고 생생하게 복원해 보는 강의다. 과거를 이해하는 일에 어떤
          과정과 체험이 필요한지를 탐구하고, 외교사의 간접적 체험에서 오늘 한국의
          국제정치를 분석하고 평가하는 안목을 기른다. 학생은 한 사건을 골라
          에세이나 픽션으로, 또는 팀을 이루어 단편영상이나 단편극으로 복원한다.
        tags: [지난 강의]

      - heading: 동아시아 국제정치사상
        kicker: 강사, 2025–2026
        gloss: 정치외교학부.
        body: >-
