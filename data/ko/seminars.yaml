title: 세미나와 소속
kicker: 다섯 모임과 한 곳의 소속
lede: >-
  셋은 동아시아의 과거를, 둘은 지금 형성되고 있는 질서를 읽는다.

sections:
  - heading: 세미나
    entries:
      - heading: 미중관계 세미나
        kicker: 월례
        gloss: 초강대국 경쟁의 방관자가 아니라 조타수로서의 중견국.
        body: >-
          중견국이 미중관계에서 수동적 방관자의 자리를 넘어, 초강대국의 경쟁을 더
          넓은 세계질서에 이로운 방향으로 능동적으로 이끌 수 있는 길을 탐색하는
          월례 세미나다.
        tags: [월례, 현대]

      - heading: 복어회(Circle of the Fish)
        kicker: 연구모임
        gloss: 과거와 현재의 동아시아 국제질서.
        body: >-
          과거와 현재의 동아시아 국제질서 연구를 다루는 연구모임이다.
        url: https://circle-of-fish.github.io/
        url_label: 모임 홈페이지
        tags: [연구모임, 역사]

      - heading: 동아시아 지성사 독회모임
        kicker: 2024년부터 월례
        gloss: 동아시아의 정치사상사와 지성사를 새로운 방법으로 읽는다.
        body: >-
          동아시아의 정치사상사와 지성사를 새로운 방법론적 시각에서 탐구하는
          학제간 독회모임이다. 조선 후기 지성사와 명·청대 향촌사회에서 한중
          조공관계, 근대 한중관계, 해방 이후 신탁통치 문제에 이르기까지를 다뤄
          왔다. 서울대학교와 케임브리지대학교, 연세대학교의 연구자 일곱 명이
          서울대학교 국제문제연구소에서 매달 모인다.
        url: https://ea-intellectual-history.github.io/
        url_label: 모임 홈페이지
        tags: [월례, 역사]

      - heading: 한국외교사 연구모임
        kicker: 2012년부터 월례
        gloss: 5세기부터 19세기까지 한반도의 지구적 외교사.
        body: >-
          5세기부터 19세기까지 한반도의 지구적 외교사를 읽는 월례 연구모임이다.
        tags: [월례, 역사]

      - heading: 인공지능과 복합지능
        kicker: 2025년부터 월례
        gloss: 인간과 AI가 지구 위에서 함께 존재하는 길, 그리고 복합지능의 조건.
        body: >-
          AI가 초래하는 지구문명사적 전환의 의미를 이해하고 그 방향을 탐색하고자
          2025년 2월에 출범한 학제간 연구모임, 복합지능연구회다. 기술철학, 현상학,
          해석학, 신학, 인지과학의 관점에서 인간지능과 인공지능이 서로 침범할 수
          없는 고유한 영역을 지니는지를 묻는다. 에릭 라슨의 AI 비판과 허욱의
          코스모테크닉스에서 시몽동의 기술적 대상론, 키신저의 AI 시대 세계질서론에
          이르기까지, 이론적 탐구와 기술 실습을 병행한다. AI를 거부하거나
          신화화하는 태도를 넘어, 인간지능과 인공지능이 결합된 복합지능으로
          공진화할 가능성을 모색한다.
        url: https://complex-intelligence.github.io/
        url_label: 모임 홈페이지
        tags: [월례, 현대]

  - heading: 소속
    entries:
      - heading: EAI Global
        kicker: 정기 기고
        gloss: 지역의 시각에서 본 동북아 안보 정책 분석.
        body: >-
          동아시아연구원(EAI)의 영문 플랫폼으로, 지역의 시각에서 본 국제 현안
          보고서와 논평, 워킹페이퍼를 싣는다. 동북아 안보와 북한 문제를 중심으로
          정기적으로 기고한다.
        url: https://global.eai.or.kr/
        url_label: EAI Global
        tags: [동아시아연구원]
