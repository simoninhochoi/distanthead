title: 세미나
kicker: 네 개의 상설 모임
lede: >-
  정기적으로 모이는 네 개의 모임이다. 둘은 동아시아 질서의 오래된 역사를, 둘은
  지금 형성되고 있는 질서를 읽는다.

entries:
  - heading: 미중관계 세미나
    kicker: 월례
    gloss: 초강대국 경쟁의 방관자가 아니라 조타수로서의 중견국.
    body: >-
      중견국이 미중관계에서 수동적 방관자의 자리를 넘어, 초강대국의 경쟁을 더
      넓은 세계질서에 이로운 방향으로 능동적으로 이끌 수 있는 길을 탐색하는 월례
      세미나다.
    tags: [월례, 현대]

  - heading: 복어회(Circle of the Fish)
    kicker: 연구모임
    gloss: 과거와 현재의 동아시아 국제질서.
    body: >-
      과거와 현재의 동아시아 국제질서 연구를 다루는 연구모임이다.
    url: https://circle-of-fish.github.io/
    url_label: 모임 홈페이지
    tags: [연구모임, 역사]

  - heading: 한국외교사 연구모임
    kicker: 2012년부터 월례
    gloss: 5세기부터 19세기까지 한반도의 지구적 외교사.
    body: >-
      5세기부터 19세기까지 한반도의 지구적 외교사를 읽는 월례 연구모임이다.
    tags: [월례, 역사]

  - heading: 인공지능과 지구의 미래
    kicker: 독서모임
    gloss: 혼종지능이 국가체계와 행성 관리에 일으키는 변화.
    body: >-
      인공지능의 부상이 세계질서의 토대를 어떻게 변환시키고 있는가를 묻는 철학적
      정치적 탐구다. 인간의 인지와 기계의 인지가 점점 더 얽혀 가는 가운데, 이
      모임은 혼종지능의 출현이 근대 세계의 두 기둥, 즉 인간의 정치적 행위성 위에
      세워진 주권국가 체계와 지구에 대한 인류의 유일한 관리자 지위를 전제한
      행성질서에 무엇을 뜻하는지를 검토한다.
    tags: [독서모임, 현대]
